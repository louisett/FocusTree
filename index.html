<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="FocusTree - 专注25分钟，种下一棵树" />
  <title>FocusTree - 专注种树</title>
  <link rel="preconnect" href="https://fonts.googleapis.cn" />
  <link rel="preconnect" href="https://fonts.gstatic.cn" crossorigin />
  <link href="https://fonts.googleapis.cn/css2?family=Noto+Sans+SC:wght@300;400;500;700&family=Noto+Serif+SC:wght@400;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles/main.css" />
</head>
<body>
  <div id="app">
    <!-- Page: Landing -->
    <section id="page-landing" class="page active">
      <div class="landing-container">
        <!-- Settings gear -->
        <button class="settings-gear" onclick="navigateTo('settings')" title="设置">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="3"/>
            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06A1.65 1.65 0 0 0 9 4.6a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/>
          </svg>
        </button>
        <div id="landing-tree" class="landing-tree" onclick="handleTreeClick()">
          <svg viewBox="0 0 240 320" width="240" height="320">
            <defs>
              <!-- 树干渐变 -->
              <linearGradient id="trunkGrad" x1="0%" y1="0%" x2="100%" y2="0%">
                <stop offset="0%" style="stop-color:#6D4C41"/>
                <stop offset="50%" style="stop-color:#8D6E63"/>
                <stop offset="100%" style="stop-color:#5D4037"/>
              </linearGradient>
              <!-- 树叶渐变 -->
              <radialGradient id="leafGrad1" cx="50%" cy="40%" r="60%">
                <stop offset="0%" style="stop-color:#81C784"/>
                <stop offset="100%" style="stop-color:#27AE60"/>
              </radialGradient>
              <radialGradient id="leafGrad2" cx="50%" cy="40%" r="60%">
                <stop offset="0%" style="stop-color:#A5D6A7"/>
                <stop offset="100%" style="stop-color:#2E7D32"/>
              </radialGradient>
              <radialGradient id="leafGrad3" cx="50%" cy="30%" r="65%">
                <stop offset="0%" style="stop-color:#C8E6C9"/>
                <stop offset="100%" style="stop-color:#4CAF50"/>
              </radialGradient>
            </defs>
            <!-- 地面阴影 -->
            <ellipse cx="120" cy="310" rx="55" ry="10" fill="#795548" opacity="0.2"/>
            <!-- 树干 -->
            <path d="M112 310 Q110 270 108 230 Q106 195 110 160 Q114 135 120 115 Q126 135 130 160 Q134 195 132 230 Q130 270 128 310 Z" fill="url(#trunkGrad)"/>
            <!-- 树干纹理 -->
            <path d="M115 280 Q116 260 115 240" stroke="#5D4037" stroke-width="1" fill="none" opacity="0.4"/>
            <path d="M125 290 Q124 265 125 245" stroke="#5D4037" stroke-width="1" fill="none" opacity="0.3"/>
            <!-- 树枝 -->
            <path d="M110 200 Q90 180 72 175" stroke="url(#trunkGrad)" stroke-width="6" fill="none" stroke-linecap="round"/>
            <path d="M130 190 Q150 170 165 168" stroke="url(#trunkGrad)" stroke-width="6" fill="none" stroke-linecap="round"/>
            <path d="M112 165 Q92 145 78 138" stroke="url(#trunkGrad)" stroke-width="5" fill="none" stroke-linecap="round"/>
            <path d="M128 155 Q148 135 160 130" stroke="url(#trunkGrad)" stroke-width="5" fill="none" stroke-linecap="round"/>
            <path d="M115 140 Q100 120 88 112" stroke="url(#trunkGrad)" stroke-width="4" fill="none" stroke-linecap="round"/>
            <path d="M125 130 Q140 110 150 105" stroke="url(#trunkGrad)" stroke-width="4" fill="none" stroke-linecap="round"/>
            <!-- 树叶层 -->
            <g class="tree-foliage">
              <!-- 底层深色叶 -->
              <ellipse cx="120" cy="95" rx="65" ry="52" fill="url(#leafGrad2)" opacity="0.85"/>
              <ellipse cx="82" cy="115" rx="40" ry="35" fill="#2E7D32" opacity="0.75"/>
              <ellipse cx="158" cy="108" rx="42" ry="36" fill="#2E7D32" opacity="0.75"/>
              <!-- 中层主叶 -->
              <ellipse cx="120" cy="75" rx="50" ry="42" fill="url(#leafGrad1)" opacity="0.9"/>
              <ellipse cx="90" cy="90" rx="35" ry="28" fill="#27AE60" opacity="0.7"/>
              <ellipse cx="150" cy="85" rx="36" ry="30" fill="#27AE60" opacity="0.7"/>
              <!-- 顶层亮叶 -->
              <ellipse cx="120" cy="55" rx="42" ry="35" fill="url(#leafGrad3)" opacity="0.75"/>
              <ellipse cx="95" cy="70" rx="28" ry="22" fill="#81C784" opacity="0.6"/>
              <ellipse cx="145" cy="65" rx="30" ry="24" fill="#81C784" opacity="0.6"/>
              <!-- 高光点缀 -->
              <ellipse cx="105" cy="50" rx="15" ry="10" fill="#C8E6C9" opacity="0.4"/>
              <ellipse cx="135" cy="60" rx="12" ry="8" fill="#C8E6C9" opacity="0.35"/>
              <!-- 可抖动叶子 -->
              <ellipse cx="68" cy="100" rx="14" ry="9" fill="#81C784" opacity="0.6" class="leaf-detail leaf-1"/>
              <ellipse cx="172" cy="95" rx="12" ry="8" fill="#27AE60" opacity="0.55" class="leaf-detail leaf-2"/>
              <ellipse cx="120" cy="38" rx="16" ry="10" fill="#A5D6A7" opacity="0.5" class="leaf-detail leaf-3"/>
              <ellipse cx="85" cy="55" rx="10" ry="7" fill="#C8E6C9" opacity="0.45" class="leaf-detail leaf-4"/>
              <ellipse cx="155" cy="50" rx="11" ry="7" fill="#81C784" opacity="0.5" class="leaf-detail leaf-5"/>
            </g>
          </svg>
          <!-- 点击时的飘落叶子容器 -->
          <div id="falling-leaves" class="falling-leaves-container"></div>
        </div>
        <h1 class="brand-title">FocusTree</h1>
        <p class="brand-slogan">专注 25 分钟，种下一棵树</p>
        <button class="btn btn-primary btn-lg" onclick="navigateTo('time')">开始种植</button>
        <p class="forest-link" onclick="navigateTo('forest')">查看森林 (<span id="landing-tree-count">0</span>棵)</p>
      </div>
    </section>

    <!-- Page: Time Selection -->
    <section id="page-time" class="page">
      <div class="page-container">
        <h2 class="page-title">今天想专注多久？</h2>
        <div class="time-slider-section">
          <div class="time-slider-display">
            <span id="time-slider-value" class="time-big-number">25</span>
            <span class="time-unit">分钟</span>
          </div>
          <div class="time-slider-wrapper">
            <input type="range" id="time-slider" min="1" max="120" value="25" oninput="onSliderInput()" />
            <div class="time-slider-labels">
              <span>1</span>
              <span>30</span>
              <span>60</span>
              <span>90</span>
              <span>120</span>
            </div>
          </div>
        </div>
        <div class="quick-times">
          <button class="btn btn-quick" onclick="setTime(5)">5分钟</button>
          <button class="btn btn-quick" onclick="setTime(15)">15分钟</button>
          <button class="btn btn-quick active" onclick="setTime(25)">25分钟<br><small>推荐</small></button>
          <button class="btn btn-quick" onclick="setTime(45)">45分钟</button>
          <button class="btn btn-quick" onclick="setTime(60)">60分钟</button>
          <button class="btn btn-quick" onclick="setTime(90)">90分钟</button>
        </div>
        <div class="btn-group">
          <button class="btn btn-secondary" onclick="navigateTo('landing')">返回</button>
          <button class="btn btn-primary" onclick="navigateTo('plant')">选择植物</button>
        </div>
      </div>
    </section>

    <!-- Page: Plant Selection -->
    <section id="page-plant" class="page">
      <div class="page-container">
        <h2 class="page-title" id="plant-page-title">专注25分钟，今天想种什么？</h2>
        <p class="page-subtitle">选择一种植物开始专注</p>
        <div id="plant-grid" class="plant-grid"></div>
        <div id="plant-harvest-info" class="harvest-info"></div>
        <div class="btn-group">
          <button class="btn btn-secondary" onclick="navigateTo('time')">返回</button>
          <button class="btn btn-primary" id="btn-start-focus" onclick="startFocus()" disabled>开始专注</button>
        </div>
      </div>
    </section>

    <!-- Page: Focus Timer -->
    <section id="page-focus" class="page">
      <div class="focus-container">
        <!-- Sound toggle -->
        <button id="sound-toggle" class="sound-toggle" onclick="toggleSound()" title="白噪音">
          <svg id="sound-icon-off" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M11 5L6 9H2v6h4l5 4V5z"/>
            <line x1="23" y1="9" x2="17" y2="15"/>
            <line x1="17" y1="9" x2="23" y2="15"/>
          </svg>
          <svg id="sound-icon-on" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="display:none;">
            <path d="M11 5L6 9H2v6h4l5 4V5z"/>
            <path d="M19.07 4.93a10 10 0 0 1 0 14.14"/>
            <path d="M15.54 8.46a5 5 0 0 1 0 7.07"/>
          </svg>
        </button>
        <div class="focus-timer" id="focus-timer">25:00</div>
        <div class="focus-plant-area" id="focus-plant-area"></div>
        <div class="focus-plant-name" id="focus-plant-name"></div>
        <button class="btn btn-giveup" onclick="showGiveUpConfirm()">放弃</button>
      </div>
      <!-- Give up modal -->
      <div id="giveup-modal" class="modal-overlay" style="display:none;">
        <div class="modal-card">
          <p class="modal-text">你的树还没长大，确定要离开吗？</p>
          <div class="modal-btns">
            <button class="btn btn-primary" onclick="hideGiveUpConfirm()">继续专注</button>
            <button class="btn btn-danger" onclick="confirmGiveUp()">确认放弃</button>
          </div>
        </div>
      </div>
    </section>

    <!-- Page: Complete -->
    <section id="page-complete" class="page">
      <div class="complete-container">
        <div class="complete-plant" id="complete-plant-area"></div>
        <div id="celebration-particles"></div>
        <div class="achievement-card" id="achievement-card">
          <div class="achievement-icon" id="achievement-icon"></div>
          <h3 class="achievement-title" id="achievement-title"></h3>
          <p class="achievement-detail" id="achievement-duration"></p>
          <p class="achievement-detail" id="achievement-goal"></p>
          <p class="achievement-detail" id="achievement-date"></p>
        </div>
        <div class="btn-group">
          <button class="btn btn-primary" onclick="navigateTo('time')">再种一棵</button>
          <button class="btn btn-secondary" onclick="navigateTo('forest')">查看森林</button>
        </div>
      </div>
    </section>

    <!-- Page: Forest -->
    <section id="page-forest" class="page">
      <div class="forest-wrapper">
        <div class="forest-header">
          <h2 class="page-title">我的森林</h2>
          <button class="forest-back-btn" onclick="navigateTo('landing')">
            <svg width="20" height="20" viewBox="0 0 20 20" fill="none"><path d="M13 4L7 10L13 16" stroke="#8D6E63" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
        </div>
        <!-- Stats Row -->
        <div id="forest-stats" class="forest-stats"></div>
        <!-- Weekly Bar Chart -->
        <div id="forest-weekly-chart" class="forest-section">
          <h3 class="section-title">本周专注</h3>
          <div id="weekly-bars" class="weekly-bars"></div>
        </div>
        <!-- Forest Visualization -->
        <div id="forest-visual" class="forest-section">
          <h3 class="section-title">我的森林 <span id="forest-visual-count" class="section-badge"></span></h3>
          <div id="forest-mini-trees" class="forest-mini-trees"></div>
        </div>
        <!-- Plant Distribution -->
        <div id="forest-distribution" class="forest-section">
          <h3 class="section-title">植物分布</h3>
          <div id="distribution-bars" class="distribution-bars"></div>
        </div>
        <!-- Today's Records -->
        <div id="forest-today" class="forest-section">
          <h3 class="section-title">今日记录</h3>
          <div id="today-records" class="today-records"></div>
        </div>
        <!-- All Records -->
        <div id="forest-all-records" class="forest-section">
          <h3 class="section-title">全部植物</h3>
          <div id="forest-list" class="forest-list"></div>
        </div>
        <!-- Empty State -->
        <div id="forest-empty" class="forest-empty" style="display:none;">
          <svg viewBox="0 0 80 80" width="80" height="80">
            <path d="M38 75 Q37 60 36 50 Q35 42 38 35 Q40 30 42 35 Q45 42 44 50 Q43 60 42 75 Z" fill="#8D6E63"/>
            <ellipse cx="40" cy="30" rx="15" ry="12" fill="#81C784" opacity="0.7"/>
            <ellipse cx="40" cy="22" rx="10" ry="8" fill="#27AE60" opacity="0.6"/>
          </svg>
          <p>森林还是空的，快去种第一棵树吧！</p>
        </div>
      </div>
    </section>

    <!-- Page: Forest Detail (sub-page for plant detail) -->
    <section id="page-forest-detail" class="page">
      <div class="forest-wrapper">
        <div class="forest-header">
          <button class="forest-back-btn" onclick="navigateTo('forest')">
            <svg width="20" height="20" viewBox="0 0 20 20" fill="none"><path d="M13 4L7 10L13 16" stroke="#8D6E63" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
          <h2 class="page-title" id="detail-title">植物详情</h2>
          <span></span>
        </div>
        <div id="detail-summary" class="detail-summary"></div>
        <div id="detail-records" class="detail-records"></div>
      </div>
    </section>

    <!-- Page: Settings -->
    <section id="page-settings" class="page">
      <div class="page-container">
        <div class="settings-header">
          <button class="forest-back-btn" onclick="navigateTo('landing')">
            <svg width="20" height="20" viewBox="0 0 20 20" fill="none"><path d="M13 4L7 10L13 16" stroke="#8D6E63" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
          <h2 class="page-title">设置</h2>
          <span></span>
        </div>
        <div class="settings-list">
          <!-- Theme Toggle -->
          <div class="settings-item">
            <div class="settings-item-info">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="var(--text-secondary)" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
              <span>深色模式</span>
            </div>
            <label class="toggle-switch">
              <input type="checkbox" id="theme-toggle" onchange="toggleTheme()" />
              <span class="toggle-slider"></span>
            </label>
          </div>
          <!-- Notification Permission -->
          <div class="settings-item">
            <div class="settings-item-info">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="var(--text-secondary)" stroke-width="2"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
              <span>完成通知</span>
            </div>
            <button class="btn btn-small" id="notif-btn" onclick="requestNotification()">开启</button>
          </div>
          <!-- Clear Data -->
          <div class="settings-item settings-item-danger">
            <div class="settings-item-info">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#e57373" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
              <span>清除所有数据</span>
            </div>
            <button class="btn btn-small btn-danger-outline" onclick="showClearConfirm()">清除</button>
          </div>
        </div>
        <!-- Clear data confirm modal -->
        <div id="clear-modal" class="modal-overlay" style="display:none;">
          <div class="modal-card">
            <p class="modal-text">确定要清除所有森林数据吗？此操作不可恢复。</p>
            <div class="modal-btns">
              <button class="btn btn-secondary" onclick="hideClearConfirm()">取消</button>
              <button class="btn btn-danger" onclick="confirmClearData()">确认清除</button>
            </div>
          </div>
        </div>
        <div class="settings-version">FocusTree v1.0</div>
      </div>
    </section>
  </div>
  <script src="scripts/app.js"></script>
</body>
</html>
